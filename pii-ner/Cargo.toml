[package]
name = "pii-ner"
version = "0.1.0"
edition = "2021"
description = "Tiny local NER sidecar for modelgate's PII layer (GLiNER token-mode ONNX via ONNX Runtime)"
license = "MIT"

[dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
