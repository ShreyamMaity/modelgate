[package]
name = "modelgate"
version = "0.1.0"
edition = "2021"
description = "Failover chains and Anthropic<->OpenAI translation in front of Tailscale Aperture (or any OpenAI-compatible gateway)"
license = "MIT"
readme = "README.md"
keywords = ["llm", "proxy", "failover", "tailscale", "aperture"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde_json = { version = "1", features = ["preserve_order"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = "0.1"
bytes = "1"
fastrand = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
aho-corasick = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
